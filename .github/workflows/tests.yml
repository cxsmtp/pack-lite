name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Syntax check
        run: node --check PocketLifeOS.js
      - name: release.json matches PocketLifeOS.js
        run: |
          expected="$(node -e "process.stdout.write(require('./release.json').sha256)")"
          actual="$(sha256sum PocketLifeOS.js | cut -d' ' -f1)"
          echo "expected $expected"; echo "actual   $actual"
          test "$expected" = "$actual"
      - name: Simulated Google + Pocket end-to-end tests
        run: node test/test.js
